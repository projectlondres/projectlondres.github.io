<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Londres</title>
<meta name="description" content="Préparation du voyage à Londres de la section européenne du Lycée du Fiumorbu.">
<meta name="theme-color" content="#012169">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Londres">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}
:root{
 --bg:#F7F6F2;--panel:#FFFFFF;--sunk:#EFEDE7;--rule:#E3E0D7;
 --ink:#15171B;--ink-2:#565B64;--ink-3:#8A8E96;
 --brand:#C8102E;--brand-soft:#FBE7EA;--navy:#012169;--navy-soft:#E6EAF4;
 --go:#0B7A55;--go-soft:#E1F2EA;--wait:#A96D00;--wait-soft:#FBF0D9;
 --ped:#1D5FB4;--fin:#C8102E;--log:#0B7A55;--bud:#6B3FA0;--com:#A96D00;
 --lift:0 1px 2px rgba(20,22,26,.05),0 8px 24px rgba(20,22,26,.06);
 --r:16px;--r-s:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121418;--panel:#1B1E24;--sunk:#23262E;--rule:#30343D;--ink:#F0EFEB;--ink-2:#A9ADB6;--ink-3:#7A7F89;
 --brand:#FF5A6E;--brand-soft:#3A1A20;--navy:#8FA8E8;--navy-soft:#1C2436;--go:#3FC69A;--go-soft:#112D24;--wait:#E8B44A;--wait-soft:#332812;
 --ped:#6FA6F0;--fin:#FF5A6E;--log:#3FC69A;--bud:#B48BE6;--com:#E8B44A;--lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--panel:#1B1E24;--sunk:#23262E;--rule:#30343D;--ink:#F0EFEB;--ink-2:#A9ADB6;--ink-3:#7A7F89;
 --brand:#FF5A6E;--brand-soft:#3A1A20;--navy:#8FA8E8;--navy-soft:#1C2436;--go:#3FC69A;--go-soft:#112D24;--wait:#E8B44A;--wait-soft:#332812;
 --ped:#6FA6F0;--fin:#FF5A6E;--log:#3FC69A;--bud:#B48BE6;--com:#E8B44A;--lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16.5px}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-2)}.small{font-size:13.5px}.xs{font-size:12px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--ink);color:var(--bg)}
.btn.brand{background:var(--brand);color:#fff}.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.go{background:var(--go-soft);color:var(--go)}.chip.wait{background:var(--wait-soft);color:var(--wait)}.chip.hot{background:var(--brand-soft);color:var(--brand)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.p-Pédagogie{background:var(--ped)}.p-Financement{background:var(--fin)}.p-Logistique{background:var(--log)}.p-Budget{background:var(--bud)}.p-Communication{background:var(--com)}

/* en-tête */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:15px}
.brand-mark span{color:#fff}
.search{flex:1;position:relative;max-width:460px;margin-left:auto}
.search input{width:100%;height:40px;border-radius:999px;border:1.5px solid var(--rule);background:var(--panel);padding:0 14px 0 38px;font-size:15px}
.search input:focus{border-color:var(--navy);outline:none}
.search>svg{position:absolute;left:12px;top:10px;color:var(--ink-3)}
.menu-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.menu-btn:hover{background:var(--sunk)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
nav.tabs .badge{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
nav.bottom{display:none}
@media (max-width:720px){
 nav.tabs{display:none}
 .brand .txt{display:none}
 nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 nav.bottom a,nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:4px 0}
 nav.bottom .on{color:var(--brand)}
 main{padding-bottom:90px}
 h1{font-size:25px}
}
/* menu déroulant */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.sheet-in{background:var(--panel);width:min(340px,100%);height:100%;padding:18px;overflow:auto;box-shadow:var(--lift)}
.sheet-in a,.sheet-in button.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;width:100%;text-align:left}
.sheet-in a:hover,.sheet-in button.row:hover{background:var(--sunk)}
.sheet-in hr{border:0;border-top:1px solid var(--rule);margin:10px 0}

/* mise en page */
main{padding:22px 0 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.page-head p{margin:6px 0 0;color:var(--ink-2)}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--lift);padding:18px;margin-bottom:14px}
.card h2{margin-bottom:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.section-t{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* accueil */
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,16,46,.55),transparent 70%)}
.hero .k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:"Bricolage Grotesque",sans-serif;font-size:56px;font-weight:800;line-height:1;margin:8px 0 6px}
.hero .sub{opacity:.9}
.hero-search{margin-top:18px;position:relative;z-index:1}
.hero-search input{width:100%;height:50px;border-radius:14px;border:0;padding:0 16px 0 46px;font-size:16px;background:#fff;color:#15171B}
.hero-search>svg{position:absolute;left:15px;top:15px;color:#8A8E96;z-index:1}
.money-big{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800}
.bar{height:12px;border-radius:999px;background:var(--sunk);position:relative;margin:14px 0 26px}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#E8475F)}
.bar-mark{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink-3)}
.bar-mark span{position:absolute;top:22px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap;font-weight:600}
.bar-mark:last-child span{transform:translateX(-100%)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:140px;background:var(--sunk);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;font-family:"Bricolage Grotesque",sans-serif}
.alert{display:flex;align-items:center;gap:10px;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px;text-decoration:none}

/* tâches */
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--rule);align-items:flex-start}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--rule);flex:none;display:grid;place-items:center;margin-top:1px}
.check:hover{box-shadow:inset 0 0 0 2px var(--go)}
.check.on{background:var(--go);box-shadow:none;color:#fff}
.check.pend{box-shadow:inset 0 0 0 2px var(--wait);background:var(--wait-soft)}
.task-b{flex:1;min-width:0}
.task-t{font-weight:600}
.task.done .task-t{color:var(--ink-3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:3px;align-items:center}
.meta .late{color:var(--brand);font-weight:700}
.note{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.links{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);padding:3px 9px;border-radius:999px;text-decoration:none}
.lk svg{width:14px;height:14px}
.phase{margin-bottom:10px}
.phase summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.phase summary::-webkit-details-marker{display:none}
.phase .pbar{height:6px;border-radius:9px;background:var(--sunk);flex:1;max-width:160px;overflow:hidden}
.phase .pbar i{display:block;height:100%;background:var(--go)}

/* papiers */
.doc{border-top:1px solid var(--rule);padding:12px 0}
.doc:first-child{border-top:0}
.doc summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center}
.doc summary::-webkit-details-marker{display:none}
.doc .dt{flex:1;font-weight:600}
.doc dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:12px 0 4px;font-size:14px}
.doc dt{color:var(--ink-3);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.doc dd{margin:0}
@media (max-width:560px){.doc dl{grid-template-columns:1fr}.doc dt{padding-top:6px}}
.st{cursor:pointer}

/* élèves */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--rule)}
table.grid{border-collapse:collapse;font-size:13px;min-width:100%}
table.grid th,table.grid td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.grid th{font-size:11.5px;color:var(--ink-2);font-weight:700;background:var(--sunk);position:sticky;top:0}
table.grid th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;vertical-align:bottom;text-align:left}
table.grid td:first-child,table.grid th:first-child{position:sticky;left:0;background:var(--panel);text-align:left;font-weight:600;z-index:1}
table.grid th:first-child{background:var(--sunk)}
.cell{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--rule);display:inline-grid;place-items:center}
.cell.on{background:var(--go);box-shadow:none;color:#fff}
.cell svg{width:14px;height:14px}

/* modèles */
.tpl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tpl-card{background:var(--panel);box-shadow:var(--lift);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.tpl-card:hover{box-shadow:inset 0 0 0 2px var(--navy),var(--lift)}
.paper{background:#fff;color:#15171B;max-width:800px;margin:0 auto;padding:44px 52px;border-radius:6px;box-shadow:var(--lift);font-size:14.5px;line-height:1.55}
.paper h1{font-size:23px;margin-bottom:6px;color:#012169}
.paper h2{font-size:16px;margin:18px 0 6px;color:#012169}
.paper .nt{color:#666;font-style:italic;font-size:12.5px;margin:0 0 14px}
.paper p{margin:0 0 10px}
.paper ul{margin:0 0 10px;padding-left:20px}
.paper .cb{display:flex;gap:9px;margin:5px 0}
.paper .cb:before{content:"";width:13px;height:13px;border:1.5px solid #333;flex:none;margin-top:4px;border-radius:2px}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13.5px}
.paper td,.paper th{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#F1F3F8}
.paper .blank{display:inline-block;min-width:120px;border-bottom:1px dotted #555;height:1em}
.paper td .blank{min-width:60px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.paper .sig div{border:1px solid #bbb;border-radius:4px;height:90px;padding:6px 8px;font-size:12.5px;color:#555}
.paper .pb{border-top:1px dashed #bbb;margin:24px 0}
@media (max-width:640px){.paper{padding:24px 18px}}

/* recherche */
.results{position:absolute;left:0;right:0;top:46px;background:var(--panel);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:50;padding:8px;min-width:300px}
.hero-search .results{top:56px;color:var(--ink)}
.res{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer}
.res:hover,.res.sel{background:var(--sunk)}
.res .ty{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);min-width:62px;padding-top:2px}
.res .rt{font-weight:600;font-size:14.5px}
.res .rs{font-size:12.5px;color:var(--ink-2)}
.ask{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;background:var(--navy-soft);color:var(--navy);font-weight:700;text-align:left;margin-top:4px}
.answer{background:var(--navy-soft);border-radius:12px;padding:12px 14px;margin:6px 0;font-size:14.5px;white-space:pre-wrap}
.flash{animation:flash 2s}
@keyframes flash{0%,40%{background:var(--wait-soft)}100%{background:transparent}}

/* formulaires */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.field input,.field textarea,.field select,.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--rule);background:var(--panel);font-size:15px}
.field textarea{min-height:80px}
.inp.sm{padding:5px 8px;font-size:13.5px;width:auto}
.row-f{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row-f>*{flex:1;min-width:120px}

/* argent */
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0}
.mrow .l{flex:1}
.mini{height:6px;border-radius:9px;background:var(--sunk);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--go)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.co{border-top:1px solid var(--rule);padding:12px 0}
.co:first-child{border-top:0}

/* connexion + vitrine */
.gate{min-height:100svh;display:grid;place-items:center;padding:30px 16px;background:radial-gradient(circle at 80% 0%,rgba(200,16,46,.10),transparent 50%),var(--bg)}
.gate-in{width:100%;max-width:420px}
.gate h1{font-size:42px;margin:14px 0 10px}
.err{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.vit-hero{background:var(--navy);color:#fff;padding:56px 0 46px}
.vit-hero h1{font-size:46px;margin:10px 0 14px}
.vit-hero p{font-size:18px;opacity:.92;max-width:640px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--lift);max-width:90vw;text-align:center}

@media print{
 header.top,nav,.no-print,.toast{display:none!important}
 body{background:#fff}
 main{padding:0}
 .paper{box-shadow:none;padding:0;max-width:none}
 .wrap{max-width:none;padding:0}
}
.card .paper th{background:var(--sunk);color:var(--ink)}.card .paper td,.card .paper th{border-color:var(--rule)}.card .paper h2{color:var(--navy)}
.steps{margin-top:6px;font-size:13.5px}.steps summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:12.5px;list-style:none}.steps summary::-webkit-details-marker{display:none}.steps summary:before{content:"▸ ";}.steps[open] summary:before{content:"▾ ";}.steps ol{margin:6px 0 0;padding-left:20px;color:var(--ink-2)}.steps li{margin:3px 0}.steps li.proof{list-style:none;margin-left:-20px;margin-top:6px;color:var(--go);font-weight:600}
</style>
</head>

"quoi":"Sur ameli.fr.","qui":"Chaque accompagnateur","quand":"27 févr. 2028","ou":"Garder sur soi","lien":"https://www.ameli.fr/assure/droits-demarches/europe-international/protection-sociale-europe/vous-partez-en-vacances-en-europe","tpl":""},{"id":"a05","scope":"adulte","t":"Contrôle d’honorabilité (FIJAISV)","quoi":"Seulement pour un accompagnateur qui n’est pas personnel de l’Éducation nationale.","qui":"Proviseur","quand":"15 mars 2028","ou":"DSDEN","lien":"https://www.education.gouv.fr/bo/2024/Hebdo30/MENE2407159C","tpl":""},{"id":"a06","scope":"adulte","t":"Formation premiers secours (PSC1)","quoi":"Recommandée : au moins un accompagnateur formé.","qui":"Accompagnateurs","quand":"15 mars 2028","ou":"Copie de l’attestation","lien":"https://www.education.gouv.fr/bo/2024/Hebdo30/MENE2407159C","tpl":""}],"scopes":[{"id":"collectif","t":"Établissement et organisation","s":"Ce que le lycée doit produire ou signer."},{"id":"finance","t":"Argent et mécénat","s":"Autorisations et papiers des actions de financement."},{"id":"eleve","t":"Par élève","s":"À réunir pour chacun des 19 élèves. Suivi nominatif dans l’onglet Élèves."},{"id":"adulte","t":"Par accompagnateur","s":"À réunir pour chacun des 3 adultes."}],"tpls":[{"id":"note-projet","t":"Note de projet (1 page)","cat":"Établissement","body":"# Note de projet — Voyage à Londres, section européenne\n> Lycée du Fiumorbu, 20243 Prunelli-di-Fiumorbu — à remettre au proviseur\n\n## Le projet\nVoyage d’étude à Londres de la classe de section européenne (DNL physique), en terminale, du mardi 16 au samedi 20 mai 2028. Hébergement obligatoire en familles d’accueil.\n\n## Objectifs pédagogiques\n- Pratiquer l’anglais en situation réelle, en famille et sur les sites.\n- Relier le programme de physique à des lieux de référence : Science Museum, Faraday Museum (Royal Institution), Royal Observatory de Greenwich.\n- Produire une restitution en anglais avant le baccalauréat.\n\n## Participants\n|Élèves|Accompagnateurs|Professeur porteur|\n|19|3 adultes|___|\n\n## Budget et financement\n|Poste|Estimation|\n|Coût total (22 personnes, 5 % d’imprévus)|11 430 € à 21 140 €|\n|Participation des familles|300 € visés, 400 € au maximum|\n|À réunir par la classe|5 730 € à 15 440 €, objectif 10 600 €|\nActions : ventes, marchés de Noël, loto, soirée anglaise, mécénat d’entreprises via la Maison des lycéens, subventions. Les frais des accompagnateurs ne sont jamais facturés aux familles ; aucun élève n’est exclu pour raison financière (fonds social lycéen).\n\n## Calendrier\n- Octobre 2026 : accord de principe du proviseur.\n- Décembre 2026 : vote du CA (accord de principe, collecte de fonds).\n- Novembre 2027 : vote du CA sur le voyage définitif.\n- 16 – 20 mai 2028 : séjour. Juin 2028 : restitution et bilan au CA.\n\n## Ce que nous demandons\n- Votre accord de principe écrit pour préparer le voyage et démarcher des entreprises.\n- L’inscription du projet à l’ordre du jour du CA de décembre 2026.\n\n=== Le professeur porteur | Les élèves référents\n"},{"id":"budget","t":"Budget prévisionnel et plan de financement","cat":"Établissement","body":"# Budget prévisionnel — Voyage à Londres, 16 – 20 mai 2028\n> 19 élèves + 3 accompagnateurs = 22 personnes. Montants à remplacer par les devis réels.\n\n## Dépenses\n|Poste|Estimation basse|Estimation haute|Devis retenu|\n|Car lycée ↔ aéroport de Bastia (aller-retour)|___|___|___|\n|Vols Bastia ↔ Londres (22 personnes)|___|___|___|\n|Transfert aéroport ↔ familles|___|___|___|\n|Familles d’accueil (4 nuits, demi-pension)|___|___|___|\n|Déjeuners (panier repas ou prévu)|___|___|___|\n|Transports à Londres (Travelcard zones 1-2)|___|___|___|\n|Visites (Greenwich tarif groupe ; Science Museum et Faraday gratuits)|___|___|___|\n|Assurance annulation et assistance|___|___|___|\n|Imprévus (5 %)|___|___|___|\n|TOTAL|11 430 €|21 140 €|___|\n\n## Recettes\n|Source|Objectif|Obtenu|\n|Participation des familles (19 × ___ €)|___|___|\n|Actions de la classe|5 200 €|___|\n|Mécénat d’entreprises (via la MDL)|___|___|\n|Subventions (commune, intercommunalité, Collectivité de Corse)|___|___|\n|Maison des lycéens|___|___|\n|TOTAL|= total des dépenses|___|\n\n> Les frais des 3 accompagnateurs sont couverts par les recettes collectives, jamais par les familles.\n"},{"id":"cahier-charges","t":"Cahier des charges pour les voyagistes","cat":"Établissement","body":"# Demande de devis — voyage scolaire à Londres\n> À envoyer à trois voyagistes immatriculés au registre Atout France\n\nMadame, Monsieur,\n\nLe Lycée du Fiumorbu (20243 Prunelli-di-Fiumorbu) prépare un voyage d’étude pour sa classe de section européenne. Nous vous remercions de nous adresser un devis détaillé selon les éléments suivants.\n\n## Le groupe\n- 19 élèves de terminale (17-18 ans, tous ressortissants de l’Union européenne) et 3 accompagnateurs.\n- Dates : du mardi 16 au samedi 20 mai 2028 (4 nuits). Dates de repli : du 9 au 13 mai 2028.\n\n## Prestations demandées\n- Vols Bastia ↔ Londres (direct si possible), bagage cabine inclus.\n- Transferts aéroport ↔ lieu de rendez-vous des familles.\n- Hébergement en familles d’accueil, 2 élèves par famille, demi-pension, panier-repas le midi. Familles proches les unes des autres et à moins de 45 minutes du centre.\n- Vérifications DBS des adultes de chaque famille (merci de préciser vos garanties).\n- Réservations : Royal Observatory Greenwich (tarif groupe), créneaux groupe au Science Museum et au Faraday Museum.\n- Assurance annulation, assistance et rapatriement.\n\n## Deux versions de devis\n- Version A : familles d’accueil fournies par vos soins.\n- Version B : familles fournies par notre professeur (vous ne gérez que transport, assurance et visites).\n\n## Merci de préciser\n- Le prix par élève, la gratuité des accompagnateurs, l’échéancier des acomptes, les conditions d’annulation, votre numéro d’immatriculation Atout France et votre garantie financière.\n\nRéponse souhaitée avant le ___.\n\n=== Le professeur porteur | Visa du chef d’établissement\n"},{"id":"programme","t":"Programme pédagogique","cat":"Établissement","body":"# Programme pédagogique — Londres, 16 – 20 mai 2028\n> Section européenne, DNL physique-chimie et anglais\n\n|Jour|Lieu|Notion de physique|Production en anglais|\n|Mardi 16|Arrivée, familles d’accueil|—|Présentation orale à la famille|\n|Mercredi 17|Science Museum|Énergie, machines, histoire des sciences|Fiche d’objet commentée par binôme|\n|Jeudi 18|Royal Observatory, Greenwich|Temps, méridien, astronomie, mesure|Interview d’un visiteur ou d’un médiateur|\n|Vendredi 19|Faraday Museum (Royal Institution)|Électromagnétisme, induction|Mini-exposé filmé (sans visage sans autorisation)|\n|Samedi 20|Retour|—|Carnet de bord complété|\n\n## Avant le départ\n- Chaque binôme prépare un exposé en anglais sur une notion ou un savant (Faraday, Maxwell, Harrison, Newton).\n- Lexique scientifique commun, relu par le professeur d’anglais.\n\n## Au retour\n- Restitution publique en anglais avant les épreuves du baccalauréat.\n- Évaluation : ___\n\n=== Professeur de physique | Professeur d’anglais\n"},{"id":"desistement","t":"Règle de désistement et de remboursement","cat":"Établissement","body":"# Règle de désistement — Voyage à Londres\n> À faire voter par le conseil d’administration avec le budget\n\n## Principe\nLes sommes collectées par la classe (actions, dons, subventions) appartiennent au projet collectif : elles ne sont jamais remboursées individuellement.\n\n## Participation versée par la famille\n|Date du désistement|Remboursement de la participation|\n|Avant la réservation des vols (décembre 2027)|Totalité|\n|Après la réservation des vols|Sommes non engagées seulement|\n|Moins de 30 jours avant le départ|Selon l’assurance annulation|\n\n## Cas de force majeure\nMaladie, décès d’un proche, décision de l’établissement : remboursement selon l’assurance annulation, sur justificatif.\n\n## Exclusion pour raison disciplinaire\nDécidée par le chef d’établissement ; remboursement des seules sommes non engagées.\n\n> Vote du CA du ___ — délibération n° ___\n"},{"id":"accord-familles","t":"Accord avec les familles d’accueil (anglais)","cat":"Établissement","body":"# Host family agreement — School trip, 16 – 20 May 2028\n> Lycée du Fiumorbu, Corsica (France) — section européenne\n\nDear host family,\n\nThank you for welcoming our students. This letter sets out what we agree together.\n\n## Dates and students\n- Arrival: Tuesday 16 May 2028, evening. Departure: Saturday 20 May 2028, morning.\n- Number of students hosted: ___ (aged 17-18). Names will be sent by ___.\n\n## What the family provides\n- A bed for each student, in a room shared only with the other student of our group.\n- Breakfast and evening meal every day, and a packed lunch on weekdays.\n- Help with the journey to the daily meeting point: ___.\n- An adult present at home each evening and night.\n\n## Safeguarding\n- Every adult (16+) living in the home holds a valid DBS check, or the agency confirms it.\n- The family has home insurance covering guests.\n- In an emergency, call the group leader first: ___ (+33 ___).\n\n## Rules for students\nStudents must be home by ___ unless on a group activity, and follow the family’s house rules.\n\n## Payment\nPrice per student per night: ___ £. Paid by ___ on ___.\n\n=== Host family (name, signature, date) | Group leader, Lycée du Fiumorbu\n"},{"id":"fiche-famille","t":"Fiche famille d’accueil (anglais)","cat":"Établissement","body":"# Host family form\n> One form per family. Kept by the group leader only.\n\n|Family name|___|\n|Address|___|\n|Phone / e-mail|___|\n|Adults living in the home (names, ages)|___|\n|DBS check for each adult (yes / via agency / date)|___|\n|Children and pets in the home|___|\n|Number of students hosted / beds|___|\n|Nearest station and journey time to central London|___|\n|Dietary needs you can cater for|___|\n|Languages spoken at home|___|\n\n[] We have home insurance covering guests.\n[] We have read and agree to the host family agreement.\n\n=== Signature | Date\n"},{"id":"liste-participants","t":"Liste des participants et contacts d’urgence","cat":"Établissement","body":"# Liste des participants — Londres, 16 – 20 mai 2028\n> Document confidentiel : direction, voyagiste, pochette du responsable. Jamais sur le site.\n\n## Élèves\n|N°|Nom, prénom|Date de naissance|N° pièce d’identité (expire le)|Famille d’accueil|Contact d’urgence 1|Contact d’urgence 2|\n|1|___|___|___|___|___|___|\n|2|___|___|___|___|___|___|\n|3|___|___|___|___|___|___|\n|4|___|___|___|___|___|___|\n|5|___|___|___|___|___|___|\n|6|___|___|___|___|___|___|\n|7|___|___|___|___|___|___|\n|8|___|___|___|___|___|___|\n|9|___|___|___|___|___|___|\n|10|___|___|___|___|___|___|\n|11|___|___|___|___|___|___|\n|12|___|___|___|___|___|___|\n|13|___|___|___|___|___|___|\n|14|___|___|___|___|___|___|\n|15|___|___|___|___|___|___|\n|16|___|___|___|___|___|___|\n|17|___|___|___|___|___|___|\n|18|___|___|___|___|___|___|\n|19|___|___|___|___|___|___|\n\n## Accompagnateurs\n|Nom, prénom|Fonction|Portable (joignable au Royaume-Uni)|N° passeport|ETA|\n|___|Professeur porteur|___|___|___|\n|___|___|___|___|___|\n|___|___|___|___|___|\n"},{"id":"protocole-urgence","t":"Protocole d’urgence et numéros utiles","cat":"Établissement","body":"# Protocole d’urgence — Londres, mai 2028\n> Une copie par accompagnateur, une dans la pochette\n\n## Numéros\n|Urgences au Royaume-Uni (police, ambulance, pompiers)|999 ou 112|\n|Conseil médical non urgent (NHS)|111|\n|Consulat général de France à Londres|___ (vérifier sur le site du consulat avant le départ)|\n|Assistance rapatriement (n° de contrat ___)|___|\n|Proviseur du lycée|___|\n|Voyagiste / compagnie aérienne|___|\n|Professeur porteur|___|\n\n## Accident ou malade\n- Appeler le 999 si urgence vitale ; sinon le 111.\n- Un accompagnateur reste avec l’élève, avec sa fiche sanitaire et sa CEAM.\n- Prévenir la famille de l’élève, puis le proviseur, puis l’assistance.\n\n## Élève perdu\n- Point de rendez-vous annoncé à chaque sortie : ___.\n- Chaque élève porte la carte avec le numéro du responsable.\n- Au-delà de 30 minutes : prévenir la police (999) et le proviseur.\n\n## Perte de pièce d’identité\n- Déclaration à la police locale, puis consulat pour un document de voyage.\n\n## Retard ou annulation de vol\n- Prévenir le groupe de contact des parents et le proviseur ; contacter l’assistance.\n"},{"id":"pochette","t":"Pochette du responsable (liste à cocher)","cat":"Établissement","body":"# Pochette du responsable — à vérifier le 10 mai 2028\n> Dans le bagage cabine du responsable, jamais en soute\n\n[] Formulaire France – Royaume-Uni validé par la préfecture : original + 2 copies\n[] Liste nominative des participants et contacts d’urgence\n[] Autorisations parentales (19)\n[] Copies des autorisations de sortie du territoire et des pièces d’identité des parents (19)\n[] Fiches sanitaires sous enveloppe fermée (19) et copies des PAI éventuels\n[] Copies des CEAM (22)\n[] Ordres de mission des accompagnateurs (3) et confirmations ETA\n[] Attestation d’assurance du groupe et n° d’assistance\n[] Billets et cartes d’embarquement\n[] Accords et fiches des familles d’accueil\n[] Confirmations des musées et du transport\n[] Protocole d’urgence\n[] Carte bancaire ou avance de fonds de l’établissement : ___\n[] Trousse de premiers secours\n"},{"id":"reunion-parents","t":"Convocation à la réunion des parents","cat":"Établissement","body":"# Réunion d’information — Voyage à Londres\n> Lycée du Fiumorbu\n\nMadame, Monsieur,\n\nVotre enfant participe au voyage de la section européenne à Londres, du mardi 16 au samedi 20 mai 2028. Nous vous invitons à une réunion d’information :\n\n|Date|___|\n|Heure|___|\n|Lieu|___|\n\n## Ordre du jour\n- Programme du séjour et hébergement en familles d’accueil.\n- Coût, participation des familles, échéancier, aides possibles (fonds social lycéen, en toute confidentialité).\n- Papiers à fournir et dates limites : le dossier vous sera remis ce jour-là.\n- Règles de vie et charte de comportement.\n- Vos questions.\n\nMerci de confirmer votre présence avec le coupon ci-dessous.\n\nLe professeur porteur du projet\n\n---\nCoupon à rendre avant le ___\nNom de l’élève : ___\n[] Nous serons présents (nombre de personnes : ___)\n[] Nous ne pourrons pas venir et souhaitons être rappelés au : ___\n\n=== Signature du responsable légal | Date\n"},{"id":"bilan","t":"Bilan pédagogique et financier","cat":"Établissement","body":"# Bilan du voyage à Londres — 16 – 20 mai 2028\n> Présenté au conseil d’administration du ___\n\n## Déroulement\n- Participants : ___ élèves, ___ accompagnateurs.\n- Programme réalisé : ___\n- Incidents éventuels et suites données : ___\n\n## Bilan pédagogique\n- Productions en anglais : ___\n- Restitution du ___ : ___\n- Ce qu’il faudrait refaire ou changer : ___\n\n## Bilan financier\n|Poste|Prévu|Réalisé|\n|Dépenses totales|___|___|\n|Participation des familles|___|___|\n|Actions de la classe|___|___|\n|Mécénat|___|___|\n|Subventions|___|___|\n|Solde|___|___|\nReliquat éventuel : versé à la Maison des lycéens / reporté sur ___.\n\n## Remerciements\nMécènes, familles d’accueil, partenaires : ___\n\n=== Le professeur porteur | Le gestionnaire\n"},{"id":"lettre-demarchage","t":"Lettre de démarchage d’une entreprise","cat":"Argent","body":"# Soutenez le voyage de la section européenne à Londres\n> Lettre validée par le proviseur le ___ — à remettre en main propre, à deux\n\nMadame, Monsieur,\n\nNous sommes les 19 élèves de la section européenne du Lycée du Fiumorbu. En mai 2028, nous partons quatre jours à Londres, en familles d’accueil, pour étudier la physique en anglais au Science Museum, au Faraday Museum et à l’Observatoire de Greenwich.\n\nPour que le coût ne soit un obstacle pour aucun d’entre nous, nous finançons une grande partie du voyage nous-mêmes : ventes, marchés, loto, soirée anglaise. Il nous manque encore ___ €.\n\n## Ce que nous vous proposons\n- Un don de ___ € (ou un don en nature : lots, produits, services).\n- Un reçu fiscal de la Maison des lycéens, si elle est éligible : 60 % du don déductible de votre impôt (dans la limite de 20 000 € ou 0,5 % du chiffre d’affaires).\n- Votre nom sur notre page de remerciements et, si vous le souhaitez, dans notre bilan envoyé à la presse locale.\n\nNous repasserons vous voir le ___ pour répondre à vos questions. Merci de votre attention.\n\n=== Pour la classe : nom, prénom, téléphone | Visa du professeur porteur\n"},{"id":"dossier-mecenat","t":"Dossier de mécénat (2 pages)","cat":"Argent","body":"# Project Londres — Dossier de mécénat\n> Section européenne, Lycée du Fiumorbu, Prunelli-di-Fiumorbu\n\n## Qui sommes-nous\n19 élèves de terminale en section européenne (discipline : physique en anglais), accompagnés de 3 adultes.\n\n## Le projet\nQuatre jours à Londres, du 16 au 20 mai 2028, en familles d’accueil. Au programme : Science Museum, Faraday Museum, Royal Observatory de Greenwich. Au retour : une restitution publique en anglais.\n\n## Pourquoi nous avons besoin de vous\n|Coût total estimé|11 430 € à 21 140 €|\n|Participation visée par famille|300 €|\n|Déjà réuni|___ €|\n|Reste à trouver|___ €|\n\n## Comment nous aider\n- Don en argent à la Maison des lycéens (chèque à son ordre ou virement).\n- Don en nature : lots pour le loto, produits pour nos ventes, impression, transport.\n- Mécénat de compétences.\n\n## Ce que vous y gagnez\n- Réduction d’impôt de 60 % du montant du don pour une entreprise (66 % pour un particulier), sur reçu fiscal de la MDL si elle est éligible.\n- Votre nom sur la vitrine du projet et dans notre bilan. Contreparties limitées à 25 % du don.\n\n## Contact\n|Élève référent|___|\n|Professeur porteur|___|\n|Lycée|Lycée du Fiumorbu, 20243 Prunelli-di-Fiumorbu|\n"},{"id":"convention-mecenat","t":"Convention de mécénat","cat":"Argent","body":"# Convention de mécénat\n> En deux exemplaires\n\nEntre :\nL’entreprise ___, représentée par ___, ci-après « le mécène »,\nEt la Maison des lycéens du Lycée du Fiumorbu, représentée par ___, ci-après « la MDL ».\n\n## Article 1 — Objet\nLe mécène soutient le voyage d’étude à Londres de la classe de section européenne (16 – 20 mai 2028).\n\n## Article 2 — Montant et forme du don\n|Don en argent|___ €|\n|Don en nature (description, valeur)|___|\n|Date du versement|___|\n\n## Article 3 — Utilisation\nLa MDL affecte le don exclusivement au financement du voyage. Tout reliquat est affecté à ___.\n\n## Article 4 — Contreparties\nMention du nom du mécène : [] vitrine du projet [] bilan [] presse locale. La valeur des contreparties ne dépasse pas 25 % du don.\n\n## Article 5 — Reçu fiscal\nLa MDL délivre un reçu fiscal (cerfa 16216) dans le mois suivant le versement, si elle y est habilitée.\n\n## Article 6 — Bilan\nLa MDL adresse au mécène un bilan du voyage avant le 30 juin 2028.\n\n=== Pour le mécène (date, signature, cachet) | Pour la MDL (date, signature)\n"},{"id":"demande-subvention","t":"Demande de subvention (commune, intercommunalité, Collectivité)","cat":"Argent","body":"# Demande de subvention\n> Adapter le destinataire : Monsieur le Maire / Monsieur le Président\n\nLycée du Fiumorbu — section européenne\n20243 Prunelli-di-Fiumorbu\n\nÀ ___\nObjet : demande de subvention pour un voyage d’étude à Londres\n\nMadame, Monsieur,\n\nLa classe de section européenne du Lycée du Fiumorbu, composée de 19 élèves du territoire, prépare un voyage d’étude à Londres du 16 au 20 mai 2028. Ce séjour en familles d’accueil associe l’anglais et la physique (Science Museum, Faraday Museum, Observatoire de Greenwich) et donnera lieu à une restitution publique.\n\nLe coût total est estimé entre 11 430 € et 21 140 €. Pour limiter la participation des familles à 300 €, les élèves financent eux-mêmes une grande partie du projet (ventes, marchés, loto, mécénat).\n\nNous sollicitons une subvention de ___ €, qui serait versée au Lycée du Fiumorbu / à la Maison des lycéens (rayer la mention inutile).\n\nVous trouverez ci-joints la note de projet, le budget prévisionnel et le plan de financement. Nous serions heureux de vous présenter le projet de vive voix.\n\nVeuillez agréer, Madame, Monsieur, l’expression de nos salutations respectueuses.\n\n=== Le chef d’établissement | Le professeur porteur\n"},{"id":"demande-mdl","t":"Demande de soutien à la Maison des lycéens","cat":"Argent","body":"# Demande au bureau de la Maison des lycéens\n> À présenter à la prochaine réunion du bureau\n\nAux membres du bureau de la MDL,\n\nLa classe de section européenne demande le soutien de la MDL pour son voyage à Londres (16 – 20 mai 2028).\n\n## Nous demandons\n- Une aide financière de ___ €.\n- L’encaissement des dons et des recettes des actions sur le compte de la MDL, avec une ligne dédiée au voyage.\n- L’ouverture d’une cagnotte en ligne au nom de la MDL.\n- La délivrance des reçus fiscaux aux donateurs, si la MDL y est habilitée.\n\n## Nous nous engageons à\n- Remettre une fiche de caisse au trésorier après chaque action.\n- Présenter un bilan financier au bureau en juin 2027 et juin 2028.\n\n=== Les élèves référents | Le professeur porteur\n"},{"id":"demande-vente","t":"Demande d’autorisation de vente au lycée","cat":"Argent","body":"# Demande d’autorisation de vente\n> À adresser au chef d’établissement\n\nMonsieur le Proviseur,\n\nLes élèves de la section européenne sollicitent l’autorisation d’organiser des ventes au profit de leur voyage à Londres.\n\n|Dates souhaitées|___|\n|Horaires (récréations, pause méridienne)|___|\n|Emplacement|___|\n|Produits vendus|___|\n|Prix de vente|___|\n|Adulte responsable|___|\n|Élèves tenant le stand (par rotation)|___|\n\n## Engagements\n- Produits emballés et étiquetés, liste des allergènes affichée.\n- Recettes remises le jour même au trésorier de la MDL avec la fiche de caisse.\n- Emplacement rendu propre.\n\n=== Les élèves référents | Avis du chef d’établissement\n"},{"id":"fiche-caisse","t":"Fiche de caisse d’une action","cat":"Argent","body":"# Fiche de caisse\n> Une fiche par action, remise au trésorier de la MDL le jour même\n\n|Action|___|\n|Date et lieu|___|\n|Tenue par|___|\n|Fond de caisse au départ|___ €|\n\n## Recettes\n|Espèces|___ €|\n|Chèques (nombre : ___)|___ €|\n|Carte / en ligne|___ €|\n|Total recettes|___ €|\n\n## Dépenses (joindre les tickets)\n|Objet|Montant|Payé par|\n|___|___|___|\n|___|___|___|\n|Total dépenses|___|—|\n\n|Bénéfice net (recettes − dépenses)|___ €|\n\n=== Élève responsable | Trésorier de la MDL (reçu le)\n"},{"id":"remerciement","t":"Lettre de remerciement à un mécène","cat":"Argent","body":"# Merci !\n> Adapter : après le don / après le voyage\n\nMadame, Monsieur,\n\nAu nom des 19 élèves de la section européenne du Lycée du Fiumorbu, nous vous remercions chaleureusement pour votre soutien de ___ € (ou : pour votre don de ___).\n\nGrâce à vous, nous nous rapprochons de notre objectif : ___ € réunis sur ___ €.\n\n[Après le voyage] Du 16 au 20 mai 2028, nous avons découvert le Science Museum, le Faraday Museum et l’Observatoire de Greenwich, et vécu quatre jours en familles d’accueil. Vous trouverez ci-joint notre bilan.\n\nVotre reçu fiscal vous est adressé par la Maison des lycéens.\n\nAvec toute notre reconnaissance,\n\n=== Les élèves de la section européenne | Le professeur porteur\n"},{"id":"fonds-social","t":"Demande d’aide au fonds social lycéen","cat":"Argent","body":"# Demande d’aide — fonds social lycéen\n> Démarche confidentielle : à remettre sous enveloppe à l’assistante sociale ou au CPE\n\nNom et prénom du responsable légal : ___\nNom et prénom de l’élève, classe : ___\n\nMadame, Monsieur,\n\nMon enfant participe au voyage de la section européenne à Londres (16 – 20 mai 2028). La participation demandée aux familles s’élève à ___ €.\n\nJe sollicite une aide du fonds social lycéen d’un montant de ___ € (ou : un étalement des paiements).\n\nMotif (facultatif) : ___\n\nJe joins les justificatifs demandés par l’établissement.\n\n=== Signature du responsable légal | Date\n"},{"id":"autorisation-parentale","t":"Autorisation parentale de participation","cat":"Dossier élève","body":"# Autorisation parentale — Voyage à Londres\n> Lycée du Fiumorbu — du mardi 16 au samedi 20 mai 2028\n\nJe soussigné(e) ___, responsable légal de l’élève ___, né(e) le ___, en classe de ___,\n\n[] autorise mon enfant à participer au voyage scolaire à Londres du 16 au 20 mai 2028, avec hébergement en famille d’accueil ;\n[] autorise les accompagnateurs à prendre, en cas d’urgence, toute mesure médicale ou chirurgicale rendue nécessaire par son état, après avis médical ;\n[] m’engage à rembourser les frais médicaux avancés par l’établissement ;\n[] certifie que mon enfant est couvert par une assurance responsabilité civile ;\n[] ai pris connaissance du programme, de la charte de comportement et de la règle de désistement.\n\n## Joignable pendant tout le séjour\n|Nom|Lien avec l’élève|Téléphone|\n|___|___|___|\n|___|___|___|\n\n=== Signature du responsable légal, précédée de « lu et approuvé » | Fait à ___, le ___\n"},{"id":"fiche-sanitaire","t":"Fiche sanitaire de liaison","cat":"Dossier élève","body":"# Fiche sanitaire de liaison — Voyage à Londres, mai 2028\n> À remettre sous enveloppe fermée au nom de l’élève. Lue uniquement par les accompagnateurs. Jamais saisie sur le site.\n\n|Nom, prénom de l’élève|___|\n|Date de naissance|___|\n|Médecin traitant (nom, téléphone)|___|\n|N° de sécurité sociale du responsable|___|\n\n## Vaccinations\n|Vaccin|Date du dernier rappel|\n|Diphtérie, tétanos, poliomyélite|___|\n|Autres|___|\n\n## Santé\n[] Mon enfant suit un traitement pendant le séjour (joindre l’ordonnance, médicaments dans leur boîte, au nom de l’élève)\n[] Mon enfant a un projet d’accueil individualisé (PAI) : joindre une copie\n[] Allergies (alimentaires, médicamenteuses, autres) : ___\n[] Régime alimentaire : ___\nRecommandations utiles (lunettes, lentilles, mal des transports, etc.) : ___\n\n## Responsable légal\n|Nom|___|\n|Téléphones|___|\n\nJe certifie exacts les renseignements portés sur cette fiche.\n\n=== Signature du responsable légal | Date\n"},{"id":"droit-image","t":"Autorisation de droit à l’image","cat":"Dossier élève","body":"# Autorisation de droit à l’image\n> Valable pour la préparation et le déroulement du voyage à Londres (2026 – 2028)\n\nJe soussigné(e) ___, responsable légal de ___ (ou l’élève majeur),\n\n## J’autorise (cocher)\n[] la prise de photos et de vidéos de mon enfant pendant les actions et le séjour ;\n[] leur publication sur la vitrine du projet et les supports du lycée ;\n[] leur publication sur les réseaux sociaux du projet ;\n[] leur transmission à la presse locale ;\n[] l’usage des images dans le bilan remis aux mécènes.\n\nAucune légende ne mentionnera le nom de famille de mon enfant. Cette autorisation est gratuite et révocable à tout moment par écrit.\n\n=== Signature du responsable légal | Signature de l’élève\n"},{"id":"charte","t":"Charte de comportement du séjour","cat":"Dossier élève","body":"# Charte de comportement — Londres, mai 2028\n> Signée par l’élève et un responsable légal\n\nJe participe à un voyage scolaire : le règlement intérieur du lycée s’applique pendant tout le séjour, y compris en famille d’accueil.\n\n## Je m’engage à\n- Respecter les horaires et les points de rendez-vous.\n- Ne jamais me déplacer seul ; rester avec mon binôme.\n- Garder mon téléphone chargé et allumé, avec le numéro du responsable enregistré.\n- Respecter les règles de ma famille d’accueil et rentrer à l’heure fixée.\n- Ne consommer ni alcool, ni tabac, ni aucune substance illicite.\n- Prévenir immédiatement un accompagnateur en cas de problème.\n- Participer à toutes les visites et aux productions en anglais.\n- Respecter les lieux visités, les transports et les autres voyageurs.\n\n## En cas de manquement grave\nLe chef d’établissement peut décider d’un retour anticipé, aux frais de la famille, et de sanctions disciplinaires.\n\n=== Signature de l’élève | Signature du responsable légal\n"},{"id":"engagement-financier","t":"Engagement financier et échéancier","cat":"Dossier élève","body":"# Engagement financier — Voyage à Londres\n> Montants votés par le conseil d’administration du ___\n\nJe soussigné(e) ___, responsable légal de l’élève ___, m’engage à verser la participation de ___ € selon l’échéancier suivant :\n\n|Versement|Montant|Date limite|\n|Acompte|___ €|___|\n|2e versement|___ €|___|\n|Solde|___ €|14 avril 2028|\n\nPaiement à l’ordre de l’agent comptable du Lycée du Fiumorbu (chèque, virement ou espèces contre reçu).\n\n[] J’ai pris connaissance de la règle de désistement et de remboursement.\n[] Je souhaite un étalement différent : ___\n[] Je souhaite être informé(e) des aides possibles (fonds social lycéen), en toute confidentialité.\n\n=== Signature du responsable légal | Date\n"},{"id":"contacts-urgence","t":"Fiche contacts d’urgence","cat":"Dossier élève","body":"# Contacts d’urgence — Londres, 16 – 20 mai 2028\n> Deux personnes joignables jour et nuit pendant tout le séjour\n\n|Élève (nom, prénom)|___|\n|Portable de l’élève|___|\n\n|Contact|Nom|Lien|Téléphone|Autre téléphone|\n|1|___|___|___|___|\n|2|___|___|___|___|\n\n=== Signature du responsable légal | Date\n"},{"id":"profil-eleve","t":"Profil pour la famille d’accueil (anglais)","cat":"Dossier élève","body":"# Student profile — for my host family\n> Written by the student, in English. Health information is sent separately by the group leader.\n\n|First name|___|\n|Age|___|\n|Hometown|Prunelli-di-Fiumorbu, Corsica|\n|Food I don’t eat (preferences or diet)|___|\n|My hobbies|___|\n|Sports I play|___|\n|What I’m looking forward to in London|___|\n\n## A few words about me\n___\n\n___\n"},{"id":"bagages","t":"Liste de bagages et carte à garder sur soi","cat":"Dossier élève","body":"# Liste de bagages — Londres, mai 2028\n> Vérifier les règles bagages de la compagnie à l’enregistrement\n\n## Sur moi, dans mon sac\n[] Carte d’identité ou passeport (valide)\n[] Autorisation de sortie du territoire + copie de la pièce d’identité du parent signataire\n[] Carte européenne d’assurance maladie\n[] Téléphone chargé + batterie externe + adaptateur prise anglaise (type G)\n[] Un peu d’argent de poche en livres ou une carte (montant conseillé : ___)\n[] Médicaments dans leur boîte avec l’ordonnance\n[] Carnet de bord et stylo\n\n## Dans la valise\n[] Vêtements pour 5 jours, un vêtement de pluie, chaussures de marche\n[] Trousse de toilette (liquides en contenants de 100 ml maximum en cabine)\n[] Un petit cadeau de Corse pour la famille d’accueil\n\n---\n# Carte à garder sur soi\n|Mon nom|___|\n|Ma famille d’accueil (adresse)|___|\n|Responsable du groupe|___ (+33 ___)|\n|Urgences au Royaume-Uni|999 ou 112|\n|Point de rendez-vous du jour|___|\n"}],"guide":[{"id":"bref","t":"Le projet en bref","body":"|Quoi|Voyage d’étude de la section européenne (DNL physique)|\n|Où|Londres, hébergement obligatoire en familles d’accueil|\n|Quand|Du mardi 16 au samedi 20 mai 2028 (repli : 9 – 13 mai)|\n|Qui|19 élèves de terminale et 3 accompagnateurs|\n|Visites|Science Museum, Faraday Museum, Royal Observatory de Greenwich|\n|Coût total|11 430 € à 21 140 € pour 22 personnes|\n|Participation des familles|300 € visés, 400 € au maximum|\n|Objectif de collecte|10 600 € (seuil bas 5 800 €, sécurité 15 500 €)|"},{"id":"regles","t":"Les 5 règles à ne jamais oublier","body":"- Ne rien réserver avant le vote définitif du CA et le délai de 15 jours qui suit.\n- Tout l’argent passe par le lycée ou la Maison des lycéens, jamais par un compte personnel.\n- Les frais des accompagnateurs ne sont jamais facturés aux familles.\n- Aucun élève n’est exclu pour raison financière : orienter vers le fonds social lycéen, en toute discrétion.\n- Aucune donnée de santé, aucun numéro de pièce d’identité et aucun contact de parent sur le site."},{"id":"formalites","t":"Formalités d’entrée au Royaume-Uni","body":"## Élève de moins de 19 ans, ressortissant de l’UE\n- Carte d’identité valide suffit, sans ETA, à condition d’être inscrit sur le formulaire France – Royaume-Uni validé par la préfecture.\n- Autorisation de sortie du territoire (cerfa 15646) + copie de la pièce d’identité du parent signataire.\n- Carte européenne d’assurance maladie.\n\n## Accompagnateur adulte\n- Passeport obligatoire.\n- ETA (autorisation électronique de voyage) : demande sur gov.uk ou l’appli UK ETA, 20 £, valable deux ans.\n\n## Le formulaire collectif\n- Remplir le « France-UK school trip travel information form » (liens dans Papiers).\n- Faire signer le proviseur, déposer en préfecture de Haute-Corse pour le cachet.\n- Emporter l’original et une copie."},{"id":"familles","t":"Familles d’accueil","body":"- Deux élèves par famille, familles proches les unes des autres.\n- Demander pour chaque famille : adultes du foyer, vérification DBS, assurance habitation, repas, trajet vers le centre.\n- Faire signer l’accord (modèle en anglais) et remplir la fiche famille.\n- Transmettre les allergies et régimes directement aux familles, jamais par le site."},{"id":"argent","t":"Collecter de l’argent : ce qui est permis","body":"- Ventes au lycée : autorisation écrite du proviseur, produits emballés et étiquetés.\n- Stand hors du lycée : autorisation d’occupation de la mairie.\n- Loto traditionnel à petites mises (moins de 20 €) : pas d’autorisation.\n- Tombola : autorisation du maire deux mois avant le tirage (cerfa 11823), seulement si les statuts de la MDL le permettent.\n- Mécénat : dons à la Maison des lycéens ; réduction d’impôt de 60 % pour une entreprise, 66 % pour un particulier, si la MDL délivre des reçus fiscaux ; contreparties limitées à 25 % du don.\n- Après chaque action : fiche de caisse remise le jour même au trésorier."},{"id":"roles","t":"Qui fait quoi","body":"|Rôle|Ce qu’il fait sur le site|\n|Élève|Consulte tout, coche ses tâches, propose des changements : l’organisateur valide|\n|Professeur|Consulte tout, modifie directement, suit les papiers par élève|\n|Organisateur|Modifie tout, valide les propositions, gère les réglages|\n\n## Les pôles\n- Pédagogie : programme, exposés, restitution.\n- Financement : ventes, événements, démarchage.\n- Logistique : devis, transport, papiers, familles d’accueil.\n- Budget : chiffres, caisse, échéancier.\n- Communication : parents, presse, remerciements."},{"id":"liens","t":"Liens officiels","body":"- Circulaire du 16 juillet 2024 sur les sorties et voyages scolaires : education.gouv.fr\n- Formulaire France – Royaume-Uni : gov.uk, « France-UK school trip travel information form »\n- ETA des adultes : gov.uk/eta\n- Autorisation de sortie du territoire : service-public.fr (cerfa 15646)\n- Carte européenne d’assurance maladie : ameli.fr\n- Ariane (déclaration du voyage) : diplomatie.gouv.fr\n- Registre des voyagistes : Atout France\n- Familles d’accueil : guide du British Council sur les homestays"},{"id":"site","t":"Utiliser le site","body":"- Chercher : taper un mot dans la barre du haut, même mal orthographié. Appuyer sur Entrée pour poser la question à l’assistant.\n- Cocher une tâche : cliquer sur le rond à gauche.\n- Imprimer un modèle : Modèles → ouvrir → Imprimer, ou Word pour le modifier.\n- Installer sur le téléphone : bouton Installer dans le menu, ou partager → Sur l’écran d’accueil (iPhone).\n- Présenter le projet à une entreprise : envoyer le lien de la vitrine (bouton Vitrine)."}],"faq":[{"q":"Quand part-on ?","a":"Du mardi 16 au samedi 20 mai 2028, vol direct Bastia – Londres si le calendrier été 2028 le confirme."},{"q":"Combien paie chaque famille ?","a":"300 € visés, 400 € au maximum, voté par le CA en novembre 2027. Le fonds social lycéen peut aider, en toute confidentialité."},{"q":"Faut-il un passeport ?","a":"Non pour les élèves de moins de 19 ans ressortissants de l’UE inscrits sur le formulaire France – Royaume-Uni : la carte d’identité suffit. Oui pour les accompagnateurs, avec une ETA."},{"q":"Qui héberge les élèves ?","a":"Des familles d’accueil, deux élèves par famille, trouvées par le professeur ou le voyagiste, avec vérification DBS des adultes."},{"q":"Où va l’argent collecté ?","a":"Sur le compte de la Maison des lycéens ou du lycée, jamais sur un compte personnel."},{"q":"Quand peut-on réserver les vols ?","a":"Seulement après le vote définitif du CA (novembre 2027) et le délai de 15 jours qui suit."},{"q":"Comment démarcher une entreprise ?","a":"Avec la lettre et le dossier de mécénat validés par le proviseur, à deux, en demandant un montant précis, puis relance à 14 jours."},{"q":"Peut-on faire une tombola ?","a":"Oui si les statuts de la MDL le permettent, avec l’autorisation du maire deux mois avant. Sinon, un loto traditionnel à petites mises ne demande aucune autorisation."}]}</script>

 while(i<L.length){var l=L[i];
  if(/^\s*$/.test(l)){flush();i++;continue;}
  if(l.indexOf("# ")===0){flush();h+="<h1>"+inl(l.slice(2))+"</h1>";i++;continue;}
  if(l.indexOf("## ")===0){flush();h+="<h2>"+inl(l.slice(3))+"</h2>";i++;continue;}
  if(l.indexOf("> ")===0){flush();h+='<p class="nt">'+inl(l.slice(2))+"</p>";i++;continue;}
  if(l==="---"){flush();h+='<div class="pb"></div>';i++;continue;}
  if(l.indexOf("=== ")===0){flush();h+='<div class="sig">'+l.slice(4).split("|").map(function(x){return"<div>"+inl(x.trim())+"</div>";}).join("")+"</div>";i++;continue;}
  if(l.indexOf("[] ")===0){flush();while(i<L.length&&L[i].indexOf("[] ")===0){h+='<div class="cb">'+inl(L[i].slice(3))+"</div>";i++;}continue;}
  if(l.indexOf("- ")===0){flush();h+="<ul>";while(i<L.length&&L[i].indexOf("- ")===0){h+="<li>"+inl(L[i].slice(2))+"</li>";i++;}h+="</ul>";continue;}
  if(l.charAt(0)==="|"){flush();h+="<table>";var first=true,multi=false;var rows=[];while(i<L.length&&L[i].charAt(0)==="|"){rows.push(L[i].replace(/^\||\|$/g,"").split("|"));i++;}

  para.push(l);i++;}

function matchWord(q){ // mots du vocabulaire proches de q -> poids

  box.innerHTML=r.map(function(x,i){var it=x.it;return'<a class="res" href="#/'+it.go+'" data-i="'+i+'"><span class="ty">'+esc(it.ty)+'</span><span><span class="rt">'+esc(it.t)+'</span>'+(it.txt?'<div class="rs">'+esc(it.txt.slice(0,110))+"</div>":"")+"</span></a>";}).join("")+

  else if(e.key==="Enter"){e.preventDefault();if(sel>=0&&rs[sel]){location.hash=rs[sel].getAttribute("href");inp.value="";close();}else if(inp.value.trim().length>1){if(!box.innerHTML)draw();askAI(inp.value.trim(),document.getElementById(rid+"-ans"));}}
  else if(e.key==="Escape"){close();inp.blur();}};
